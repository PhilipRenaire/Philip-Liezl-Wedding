<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Share Your Memories | Philip & Liezl</title>
  <meta name="description" content="Share your wedding photos and videos with Philip and Liezl." />
  <link rel="stylesheet" href="styles.css?v=photo-share-nav-20260920" />
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 12% 6%, rgba(217, 198, 232, 0.30), transparent 30%),
        radial-gradient(circle at 90% 92%, rgba(239, 226, 200, 0.60), transparent 32%),
        linear-gradient(180deg, #fffaf0 0%, #ffffff 50%, #fff8ee 100%);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .share-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 250, 240, 0.94);
      border-bottom: 1px solid rgba(199, 158, 73, 0.24);
      box-shadow: 0 10px 30px rgba(36, 23, 38, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .share-nav-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .share-brand {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      text-decoration: none;
    }

    .share-brand img {
      display: block;
      width: 84px;
      height: auto;
    }

    .share-nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      margin-left: auto;
    }

    .share-nav-links a {
      position: relative;
      color: var(--dark);
      text-decoration: none !important;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.4;
    }

    .share-nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -5px;
      height: 2px;
      background: #7d4f8d;
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.2s ease;
    }

    .share-nav-links a:hover::after {
      transform: scaleX(1);
    }

    .share-frame {
      display: block;
      width: 100%;
      height: 1240px;
      flex: 0 0 auto;
      border: 0;
      background: transparent;
    }

    .share-fallback {
      display: none;
      padding: 28px 18px 40px;
      text-align: center;
    }

    @media (max-width: 860px) {
      .share-nav-inner {
        width: 100%;
        min-height: 64px;
        padding: 11px 14px;
        gap: 10px;
      }

      .share-brand,
      .share-brand img {
        width: 70px;
      }

      .share-brand {
        height: auto;
        flex: 0 0 70px;
      }

      .share-nav-links {
        position: static !important;
        inset: auto !important;
        display: flex !important;
        flex: 1 1 auto;
        flex-direction: row !important;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        min-width: 0;
        margin-left: auto;
        padding: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
      }

      .share-nav-links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 8px 10px;
        border: 1px solid rgba(75,36,95,.14);
        border-radius: 999px;
        background: rgba(255,255,255,.58);
        color: var(--deep-purple);
        font-size: 12px;
        line-height: 1.1;
        text-align: center;
        white-space: nowrap;
      }

      .share-nav-links a::after {
        content: none;
        display: none;
      }

      .share-frame {
        height: 1460px;
      }
    }

    @media (max-width: 380px) {
      .share-nav-inner {
        padding-left: 10px;
        padding-right: 10px;
        gap: 7px;
      }

      .share-brand,
      .share-brand img {
        width: 62px;
      }

      .share-brand {
        flex-basis: 62px;
      }

      .share-nav-links {
        gap: 6px;
      }

      .share-nav-links a {
        min-height: 36px;
        padding: 7px 8px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <nav class="share-nav" aria-label="Share memories navigation">
    <div class="share-nav-inner">
      <a class="share-brand" href="index.html" aria-label="Philip and Liezl home">
        <img src="assets/logo-pl.svg" alt="Philip &amp; Liezl" />
      </a>

      <div class="share-nav-links">
        <a href="index.html">Back to Home</a>
        <a href="gallery.html">Back to Gallery</a>
      </div>
    </div>
  </nav>

  <iframe
    class="share-frame"
    src="https://script.google.com/macros/s/AKfycbxt2yuy21SSgdh3nxCcxOTD07G9ikLyX5q4km_3ZGT1Y2QwYGgK8M3c0X6wfaVxtHy84g/exec"
    title="Share Your Memories upload form"
    loading="eager"
    allow="camera; microphone"
  ></iframe>

  <footer class="footer">
    <p>Philip &amp; Liezl · October 19, 2026 · Dahilayan Forest Park Resort</p>
    <p>Thank you for being part of our story.</p>
  </footer>

  <noscript>
    <div class="share-fallback">
      <p>Please enable JavaScript to use the upload form.</p>
      <a class="btn primary" href="https://script.google.com/macros/s/AKfycbxt2yuy21SSgdh3nxCcxOTD07G9ikLyX5q4km_3ZGT1Y2QwYGgK8M3c0X6wfaVxtHy84g/exec">Open Upload Page</a>
    </div>
  </noscript>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Share Your Memories | Philip & Liezl</title>
  <meta name="description" content="Share your wedding photos and videos with Philip and Liezl." />
  <link rel="stylesheet" href="styles.css?v=photo-share-nav-20260920" />
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 12% 6%, rgba(217, 198, 232, 0.30), transparent 30%),
        radial-gradient(circle at 90% 92%, rgba(239, 226, 200, 0.60), transparent 32%),
        linear-gradient(180deg, #fffaf0 0%, #ffffff 50%, #fff8ee 100%);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .share-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      padding: 14px 22px;
      background: rgba(255, 250, 240, 0.94);
      border-bottom: 1px solid rgba(199, 158, 73, 0.24);
      box-shadow: 0 10px 30px rgba(36, 23, 38, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .share-brand {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      text-decoration: none;
    }

    .share-brand img {
      display: block;
      width: 84px;
      height: auto;
    }

    .share-bottom-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 20px 18px 36px;
      margin-top: -10px;
      background: transparent;
    }

    .share-bottom-nav a {
      color: #111111;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.4;
    }

    .share-bottom-nav a:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .share-frame {
      display: block;
      width: 100%;
      height: 1240px;
      flex: 0 0 auto;
      border: 0;
      background: transparent;
    }

    .share-fallback {
      display: none;
      padding: 28px 18px 40px;
      text-align: center;
    }

    @media (max-width: 620px) {
      .share-nav {
        gap: 12px;
        padding: 10px 12px;
      }

      .share-brand img {
        width: 62px;
      }

      .share-bottom-nav {
        gap: 22px;
        padding: 22px 14px 30px;
      }

      .share-bottom-nav a {
        font-size: 14px;
      }

      .share-frame {
        height: 1460px;
      }
    }
  </style>
</head>
<body>
  <nav class="share-nav" aria-label="Share memories navigation">
    <a class="share-brand" href="index.html" aria-label="Philip and Liezl home">
      <img src="assets/logo-pl.svg" alt="Philip &amp; Liezl" />
    </a>
  </nav>

  <iframe
    class="share-frame"
    src="https://script.google.com/macros/s/AKfycbxt2yuy21SSgdh3nxCcxOTD07G9ikLyX5q4km_3ZGT1Y2QwYGgK8M3c0X6wfaVxtHy84g/exec"
    title="Share Your Memories upload form"
    loading="eager"
    allow="camera; microphone"
  ></iframe>

  <nav class="share-bottom-nav" aria-label="Share memories footer navigation">
    <a href="index.html">Back to Home</a>
    <a href="gallery.html">Back to the Gallery</a>
  </nav>

  <noscript>
    <div class="share-fallback">
      <p>Please enable JavaScript to use the upload form.</p>
      <a class="btn primary" href="https://script.google.com/macros/s/AKfycbxt2yuy21SSgdh3nxCcxOTD07G9ikLyX5q4km_3ZGT1Y2QwYGgK8M3c0X6wfaVxtHy84g/exec">Open Upload Page</a>
    </div>
  </noscript>
</body>
</html>
